<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Modern Apartment Booking</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        .bg-blue-500{
            background-color: #459bac!important;
        }

        .text-blue-500 {
            color: #459bac!important;
        }

        /* Custom scrollbar */
        ::-webkit-scrollbar {
            width: 8px;
        }
        ::-webkit-scrollbar-track {
            background: #f1f1f1;
        }
        ::-webkit-scrollbar-thumb {
            background: #888;
            border-radius: 4px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: #555;
        }
        
        /* Animation for cards */
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }
        
        .card-animation {
            animation: fadeIn 0.5s ease-out forwards;
        }
        
        /* Custom checkbox */
        .custom-checkbox {
            appearance: none;
            -webkit-appearance: none;
            width: 20px;
            height: 20px;
            border: 2px solid #e2e8f0;
            border-radius: 4px;
            outline: none;
            cursor: pointer;
            position: relative;
        }
        
        .custom-checkbox:checked {
            background-color: #3b82f6;
            border-color: #3b82f6;
        }
        
        .custom-checkbox:checked::after {
            content: '\2713';
            position: absolute;
            color: white;
            font-size: 12px;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
        }
        
        /* Price range slider */
        .range-slider {
            -webkit-appearance: none;
            width: 100%;
            height: 6px;
            border-radius: 5px;
            background: #e2e8f0;
            outline: none;
        }
        
        .range-slider::-webkit-slider-thumb {
            -webkit-appearance: none;
            appearance: none;
            width: 18px;
            height: 18px;
            border-radius: 50%;
            background: #3b82f6;
            cursor: pointer;
        }
        
        .range-slider::-moz-range-thumb {
            width: 18px;
            height: 18px;
            border-radius: 50%;
            background: #3b82f6;
            cursor: pointer;
        }
    </style>
</head>
<body class="bg-gray-50 font-sans">
    <div class="min-h-screen flex flex-col">
        <!-- Header -->
        <header class="bg-white shadow-sm">
            <div class="container mx-auto px-4 py-4 flex justify-between items-center">
                <div class="flex items-center">
                    <i class="fas fa-building text-blue-500 text-2xl mr-2"></i>
                    <h1 class="text-xl font-bold text-gray-800">StayFinder</h1>
                </div>
                <div class="hidden md:flex space-x-6">
                    <a href="#" class="text-gray-600 hover:text-blue-500">Home</a>
                    <a href="#" class="text-gray-600 hover:text-blue-500">Favorites</a>
                    <a href="#" class="text-gray-600 hover:text-blue-500">Popular</a>
                    <a href="#" class="text-gray-600 hover:text-blue-500">Privacy and Terms</a>
                </div>
                <div class="flex items-center space-x-4">
                    <button class="hidden md:block bg-blue-500 hover:bg-blue-600 text-white px-4 py-2 rounded-lg transition">
                        List your property
                    </button>
                    <button class="p-2 rounded-full bg-gray-100 text-gray-600">
                        <i class="fas fa-bell"></i>
                    </button>
                    <div class="w-8 h-8 rounded-full bg-blue-500 flex items-center justify-center text-white">
                        <span>JS</span>
                    </div>
                </div>
            </div>
        </header>

        <!-- Main Content -->
        <main class="flex-grow container mx-auto px-4 py-6 flex flex-col md:flex-row">
            <!-- Filters Sidebar -->
            <aside class="w-full md:w-80 lg:w-96 bg-white rounded-xl shadow-sm p-6 mb-6 md:mb-0 md:mr-6">
                <div class="flex justify-between items-center mb-6">
                    <h2 class="text-lg font-semibold text-gray-800">Filters</h2>
                    <button class="text-blue-500 hover:text-blue-700 text-sm">Reset all</button>
                </div>
                
                <!-- Search Location -->
                <div class="mb-6">
                    <label class="block text-sm font-medium text-gray-700 mb-2">Location</label>
                    <div class="relative">
                        <input type="text" placeholder="Where are you going?" 
                               class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-blue-500">
                        <i class="fas fa-search absolute right-3 top-3 text-gray-400"></i>
                    </div>
                </div>
                
                <!-- Date Range -->
                <div class="mb-6">
                    <label class="block text-sm font-medium text-gray-700 mb-2">Dates</label>
                    <div class="grid grid-cols-2 gap-2">
                        <div class="border border-gray-300 rounded-lg p-2">
                            <label class="text-xs text-gray-500">Check-in</label>
                            <input type="date" class="w-full text-sm focus:outline-none">
                        </div>
                        <div class="border border-gray-300 rounded-lg p-2">
                            <label class="text-xs text-gray-500">Check-out</label>
                            <input type="date" class="w-full text-sm focus:outline-none">
                        </div>
                    </div>
                </div>
                
                <!-- Price Range -->
                <div class="mb-6">
                    <label class="block text-sm font-medium text-gray-700 mb-2">Price range</label>
                    <div class="mb-2">
                        <input type="range" min="0" max="1000" value="300" class="range-slider">
                    </div>
                    <div class="flex justify-between text-sm text-gray-600">
                        <span>$0</span>
                        <span>$1000+</span>
                    </div>
                </div>
                
                <!-- Property Type -->
                <div class="mb-6">
                    <label class="block text-sm font-medium text-gray-700 mb-2">Property type</label>
                    <div class="space-y-2">
                        <label class="flex items-center space-x-3 cursor-pointer">
                            <input type="checkbox" class="custom-checkbox">
                            <span class="text-gray-700">Apartment</span>
                        </label>
                        <label class="flex items-center space-x-3 cursor-pointer">
                            <input type="checkbox" class="custom-checkbox">
                            <span class="text-gray-700">House</span>
                        </label>
                        <label class="flex items-center space-x-3 cursor-pointer">
                            <input type="checkbox" class="custom-checkbox">
                            <span class="text-gray-700">Villa</span>
                        </label>
                        <label class="flex items-center space-x-3 cursor-pointer">
                            <input type="checkbox" class="custom-checkbox">
                            <span class="text-gray-700">Condo</span>
                        </label>
                    </div>
                </div>
                
                <!-- Amenities -->
                <div class="mb-6">
                    <label class="block text-sm font-medium text-gray-700 mb-2">Amenities</label>
                    <div class="space-y-2">
                        <label class="flex items-center space-x-3 cursor-pointer">
                            <input type="checkbox" class="custom-checkbox">
                            <span class="text-gray-700">WiFi</span>
                        </label>
                        <label class="flex items-center space-x-3 cursor-pointer">
                            <input type="checkbox" class="custom-checkbox">
                            <span class="text-gray-700">Pool</span>
                        </label>
                        <label class="flex items-center space-x-3 cursor-pointer">
                            <input type="checkbox" class="custom-checkbox">
                            <span class="text-gray-700">Kitchen</span>
                        </label>
                        <label class="flex items-center space-x-3 cursor-pointer">
                            <input type="checkbox" class="custom-checkbox">
                            <span class="text-gray-700">Parking</span>
                        </label>
                        <label class="flex items-center space-x-3 cursor-pointer">
                            <input type="checkbox" class="custom-checkbox">
                            <span class="text-gray-700">Air conditioning</span>
                        </label>
                    </div>
                </div>
                
                <!-- Instant Book -->
                <div class="mb-6">
                    <label class="flex items-center space-x-3 cursor-pointer">
                        <input type="checkbox" class="custom-checkbox">
                        <span class="text-gray-700 font-medium">Instant book</span>
                    </label>
                    <p class="text-xs text-gray-500 mt-1">Book without waiting for host approval</p>
                </div>
                
                <button class="w-full bg-blue-500 hover:bg-blue-600 text-white py-3 rounded-lg font-medium transition">
                    Apply filters
                </button>
            </aside>
            
            <!-- Apartment Listings -->
            <div class="flex-grow">
                <div class="flex justify-between items-center mb-6">
                    <h2 class="text-xl font-semibold text-gray-800">124 apartments available</h2>
                    <div class="flex items-center space-x-2">
                    </div>
                </div>
                
                <!-- Map View Toggle -->
                <div class="mb-6 flex justify-between items-center">
                    <div class="flex space-x-2">
                        <button class="px-3 py-1 bg-blue-500 text-white rounded-lg text-sm">List view</button>
                        <button class="px-3 py-1 bg-gray-200 text-gray-700 rounded-lg text-sm hover:bg-gray-300">Map view</button>
                    </div>
                    <div class="text-sm text-gray-600">
                        <span class="font-medium">New York</span>, United States
                    </div>
                </div>
                
                <!-- Apartment Cards -->
                <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6" id="apartment-list">
                    <!-- Cards will be added here by JavaScript -->
                </div>
                
                <!-- Pagination -->
                <div class="mt-8 flex justify-center">
                    <nav class="flex items-center space-x-2">
                        <button class="px-3 py-1 rounded-lg border border-gray-300 text-gray-700 hover:bg-gray-100">
                            <i class="fas fa-chevron-left"></i>
                        </button>
                        <button class="px-3 py-1 rounded-lg bg-blue-500 text-white">1</button>
                        <button class="px-3 py-1 rounded-lg border border-gray-300 text-gray-700 hover:bg-gray-100">2</button>
                        <button class="px-3 py-1 rounded-lg border border-gray-300 text-gray-700 hover:bg-gray-100">3</button>
                        <button class="px-3 py-1 rounded-lg border border-gray-300 text-gray-700 hover:bg-gray-100">
                            <i class="fas fa-chevron-right"></i>
                        </button>
                    </nav>
                </div>
            </div>
        </main>
    </div>

    <script>
        // Sample apartment data
        const apartments = [
            {
                id: 1,
                title: "Modern Loft in Downtown",
                location: "Manhattan, New York",
                price: 189,
                rating: 4.92,
                reviews: 124,
                type: "Apartment",
                beds: 2,
                baths: 1,
                amenities: ["WiFi", "Kitchen", "Air conditioning"],
                image: "https://images.unsplash.com/photo-1522708323590-d24dbb6b0267?ixlib=rb-4.0.3&ixid=M3wxMjA3fDB8MHxwaG90by1wYWdlfHx8fGVufDB8fHx8fA%3D%3D&auto=format&fit=crop&w=1470&q=80",
                superhost: true,
                instantBook: true
            },
            {
                id: 2,
                title: "Cozy Studio Near Central Park",
                location: "Upper West Side, New York",
                price: 145,
                rating: 4.85,
                reviews: 89,
                type: "Studio",
                beds: 1,
                baths: 1,
                amenities: ["WiFi", "Kitchen", "TV"],
                image: "https://images.unsplash.com/photo-1493809842364-78817add7ffb?ixlib=rb-4.0.3&ixid=M3wxMjA3fDB8MHxwaG90by1wYWdlfHx8fGVufDB8fHx8fA%3D%3D&auto=format&fit=crop&w=1470&q=80",
                superhost: false,
                instantBook: true
            },
            {
                id: 3,
                title: "Luxury Penthouse with City View",
                location: "Midtown, New York",
                price: 350,
                rating: 4.98,
                reviews: 56,
                type: "Penthouse",
                beds: 3,
                baths: 2,
                amenities: ["WiFi", "Pool", "Kitchen", "Parking", "Air conditioning"],
                image: "https://images.unsplash.com/photo-1560448204-e02f11c3d0e2?ixlib=rb-4.0.3&ixid=M3wxMjA3fDB8MHxwaG90by1wYWdlfHx8fGVufDB8fHx8fA%3D%3D&auto=format&fit=crop&w=1470&q=80",
                superhost: true,
                instantBook: false
            },
            {
                id: 4,
                title: "Charming Brownstone Apartment",
                location: "Brooklyn, New York",
                price: 210,
                rating: 4.79,
                reviews: 102,
                type: "Apartment",
                beds: 2,
                baths: 1,
                amenities: ["WiFi", "Kitchen", "Washer"],
                image: "https://images.unsplash.com/photo-1554469384-e58fac16e23a?ixlib=rb-4.0.3&ixid=M3wxMjA3fDB8MHxwaG90by1wYWdlfHx8fGVufDB8fHx8fA%3D%3D&auto=format&fit=crop&w=1374&q=80",
                superhost: false,
                instantBook: true
            },
            {
                id: 5,
                title: "Stylish Soho Loft",
                location: "Soho, New York",
                price: 275,
                rating: 4.91,
                reviews: 78,
                type: "Loft",
                beds: 1,
                baths: 1,
                amenities: ["WiFi", "Kitchen", "Air conditioning", "Workspace"],
                image: "https://images.unsplash.com/photo-1502672260266-1c1ef2d93688?ixlib=rb-4.0.3&ixid=M3wxMjA3fDB8MHxwaG90by1wYWdlfHx8fGVufDB8fHx8fA%3D%3D&auto=format&fit=crop&w=1380&q=80",
                superhost: true,
                instantBook: true
            },
            {
                id: 6,
                title: "Waterfront Apartment with Terrace",
                location: "Long Island City, New York",
                price: 230,
                rating: 4.87,
                reviews: 65,
                type: "Apartment",
                beds: 2,
                baths: 2,
                amenities: ["WiFi", "Kitchen", "Balcony", "Gym"],
                image: "https://images.unsplash.com/photo-1580587771525-78b9dba3b914?ixlib=rb-4.0.3&ixid=M3wxMjA3fDB8MHxwaG90by1wYWdlfHx8fGVufDB8fHx8fA%3D%3D&auto=format&fit=crop&w=1374&q=80",
                superhost: false,
                instantBook: false
            }
        ];

        // Function to create apartment cards
        function createApartmentCards() {
            const container = document.getElementById('apartment-list');
            container.innerHTML = '';
            
            apartments.forEach((apartment, index) => {
                const card = document.createElement('div');
                card.className = `bg-white rounded-xl shadow-sm overflow-hidden hover:shadow-md transition-all duration-300 card-animation`;
                card.style.animationDelay = `${index * 0.1}s`;
                
                // Create amenities string
                const amenitiesString = apartment.amenities.slice(0, 3).join(' · ');
                
                card.innerHTML = `
                    <div class="relative">
                        <img src="${apartment.image}" alt="${apartment.title}" class="w-full h-48 object-cover">
                        <button class="absolute top-3 right-3 p-2 bg-white bg-opacity-90 rounded-full text-gray-800 hover:text-red-500">
                            <i class="far fa-heart"></i>
                        </button>
                        ${apartment.superhost ? `
                        <div class="absolute top-3 left-3 bg-white px-2 py-1 rounded-full flex items-center">
                            <i class="fas fa-medal text-blue-500 mr-1"></i>
                            <span class="text-xs font-medium">Superhost</span>
                        </div>` : ''}
                        ${apartment.instantBook ? `
                        <div class="absolute bottom-3 left-3 bg-blue-500 text-white px-2 py-1 rounded-full">
                            <span class="text-xs font-medium">Instant book</span>
                        </div>` : ''}
                    </div>
                    <div class="p-4">
                        <div class="flex justify-between items-start mb-2">
                            <h3 class="font-semibold text-gray-800">${apartment.title}</h3>
                            <div class="flex items-center">
                                <i class="fas fa-star text-yellow-400 mr-1"></i>
                                <span class="text-sm">${apartment.rating}</span>
                            </div>
                        </div>
                        <p class="text-sm text-gray-500 mb-2">${apartment.location}</p>
                        <p class="text-sm text-gray-500 mb-3">${apartment.beds} beds · ${apartment.baths} baths · ${apartment.type}</p>
                        <p class="text-sm text-gray-600 mb-3">${amenitiesString}${apartment.amenities.length > 3 ? ' · more' : ''}</p>
                        <div class="flex justify-between items-center">
                            <div>
                                <span class="font-semibold text-gray-800">$${apartment.price}</span>
                                <span class="text-sm text-gray-500"> / night</span>
                            </div>
                            <button class="text-blue-500 hover:text-blue-700 text-sm font-medium">View details</button>
                        </div>
                    </div>
                `;
                
                container.appendChild(card);
            });
        }

        // Initialize the page
        document.addEventListener('DOMContentLoaded', () => {
            createApartmentCards();
            
            // Add click event to heart icons
            document.querySelectorAll('.fa-heart').forEach(icon => {
                icon.addEventListener('click', function() {
                    if (this.classList.contains('far')) {
                        this.classList.remove('far');
                        this.classList.add('fas', 'text-red-500');
                    } else {
                        this.classList.remove('fas', 'text-red-500');
                        this.classList.add('far');
                    }
                });
            });
        });
    </script>
</body>
</html>
