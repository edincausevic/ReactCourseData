<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Modern Image Gallery</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        
        body {
            background: linear-gradient(135deg, #0f2027, #203a43, #2c5364);
            color: #fff;
            min-height: 100vh;
            padding: 30px;
        }
        
        .container {
            max-width: 1200px;
            margin: 0 auto;
        }
        
        header {
            text-align: center;
            margin-bottom: 40px;
        }
        
        h1 {
            font-size: 2.8rem;
            margin-bottom: 15px;
            background: linear-gradient(to right, #00b4db, #0083b0);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        
        .tagline {
            font-size: 1.2rem;
            opacity: 0.8;
            margin-bottom: 30px;
        }
        
        .gallery-container {
            display: flex;
            gap: 30px;
            flex-wrap: wrap;
        }
        
        .main-display {
            flex: 1;
            min-width: 300px;
            background: rgba(255, 255, 255, 0.05);
            border-radius: 15px;
            padding: 20px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
            backdrop-filter: blur(10px);
        }
        
        .display-image {
            width: 100%;
            height: 400px;
            border-radius: 10px;
            overflow: hidden;
            position: relative;
        }
        
        .display-image img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            transition: transform 0.3s ease;
        }
        
        .display-image:hover img {
            transform: scale(1.02);
        }
        
        .image-info {
            padding: 20px 0;
        }
        
        .image-info h2 {
            font-size: 1.8rem;
            margin-bottom: 10px;
        }
        
        .image-info p {
            line-height: 1.6;
            color: #ccc;
        }
        
        .thumbnails {
            width: 280px;
            display: flex;
            flex-direction: column;
            gap: 15px;
        }
        
        .thumbnail {
            height: 100px;
            border-radius: 8px;
            overflow: hidden;
            cursor: pointer;
            opacity: 0.7;
            transition: all 0.3s ease;
            position: relative;
        }
        
        .thumbnail:hover {
            opacity: 1;
            transform: translateY(-3px);
        }
        
        .thumbnail.active {
            opacity: 1;
            border: 2px solid #00b4db;
            transform: scale(1.05);
        }
        
        .thumbnail img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
        
        .thumbnail-overlay {
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            background: rgba(0, 0, 0, 0.7);
            padding: 5px;
            font-size: 0.8rem;
            text-align: center;
        }
        
        .controls {
            display: flex;
            justify-content: space-between;
            margin-top: 20px;
        }
        
        .filter-buttons {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
            flex-wrap: wrap;
        }
        
        .filter-btn {
            background: rgba(255, 255, 255, 0.1);
            border: none;
            color: #fff;
            padding: 8px 15px;
            border-radius: 20px;
            cursor: pointer;
            transition: all 0.3s ease;
        }
        
        .filter-btn:hover, .filter-btn.active {
            background: #00b4db;
        }
        
        .btn {
            background: #00b4db;
            color: white;
            border: none;
            padding: 12px 25px;
            border-radius: 30px;
            cursor: pointer;
            font-weight: 600;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        
        .btn:hover {
            background: #0083b0;
            transform: translateY(-2px);
        }
        
        .btn i {
            font-size: 1.2rem;
        }
        
        .lightbox {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.9);
            z-index: 1000;
            justify-content: center;
            align-items: center;
            flex-direction: column;
        }
        
        .lightbox-content {
            max-width: 90%;
            max-height: 80%;
        }
        
        .lightbox-content img {
            max-width: 100%;
            max-height: 80vh;
            border-radius: 10px;
        }
        
        .lightbox-close {
            position: absolute;
            top: 30px;
            right: 30px;
            font-size: 2rem;
            color: white;
            cursor: pointer;
        }
        
        .lightbox-caption {
            margin-top: 20px;
            font-size: 1.2rem;
        }
        
        @media (max-width: 768px) {
            .gallery-container {
                flex-direction: column;
            }
            
            .thumbnails {
                width: 100%;
                flex-direction: row;
                flex-wrap: wrap;
            }
            
            .thumbnail {
                width: calc(33.333% - 10px);
                height: 80px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>Modern Image Gallery</h1>
            <p class="tagline">Click on thumbnails to view images in the main display</p>
            
            <div class="filter-buttons">
                <button class="filter-btn active" data-filter="all">All</button>
                <button class="filter-btn" data-filter="nature">Nature</button>
                <button class="filter-btn" data-filter="urban">Urban</button>
                <button class="filter-btn" data-filter="abstract">Abstract</button>
            </div>
        </header>
        
        <div class="gallery-container">
            <div class="main-display">
                <div class="display-image">
                    <img id="main-image" src="https://images.unsplash.com/photo-1506744038136-46273834b3fb" alt="Mountain Landscape">
                    <div class="btn view-fullscreen" style="position: absolute; bottom: 20px; right: 20px;">
                        <i class="fas fa-expand"></i> Expand
                    </div>
                </div>
                <div class="image-info">
                    <h2 id="image-title">Mountain Landscape</h2>
                    <p id="image-description">Breathtaking view of mountain ranges during golden hour. The perfect blend of nature's beauty and tranquility.</p>
                </div>
                
                <div class="controls">
                    <button class="btn" id="prev-btn">
                        <i class="fas fa-arrow-left"></i> Previous
                    </button>
                    <button class="btn" id="next-btn">
                        Next <i class="fas fa-arrow-right"></i>
                    </button>
                </div>
            </div>
            
            <div class="thumbnails">
                <!-- Thumbnails will be generated by JavaScript -->
            </div>
        </div>
    </div>
    
    <div class="lightbox" id="lightbox">
        <div class="lightbox-close">
            <i class="fas fa-times"></i>
        </div>
        <div class="lightbox-content">
            <img src="" alt="">
        </div>
        <div class="lightbox-caption"></div>
    </div>

    <script>
        // Gallery data
        const galleryImages = [
            {
                src: "https://images.unsplash.com/photo-1506744038136-46273834b3fb",
                title: "Mountain Landscape",
                description: "Breathtaking view of mountain ranges during golden hour. The perfect blend of nature's beauty and tranquility.",
                category: "nature"
            },
            {
                src: "https://images.unsplash.com/photo-1519501025264-65ba15a82390",
                title: "City Skyline",
                description: "Modern urban skyline at dusk with vibrant lights and towering skyscrapers.",
                category: "urban"
            },
            {
                src: "https://images.unsplash.com/photo-1452570053594-1b985d6ea890",
                title: "Abstract Art",
                description: "Colorful abstract painting with fluid shapes and vibrant color transitions.",
                category: "abstract"
            },
            {
                src: "https://images.unsplash.com/photo-1475924156734-496f6cac6ec1",
                title: "Rocky Beach",
                description: "Serene coastal view with waves crashing against weathered rocks.",
                category: "nature"
            },
            {
                src: "https://images.unsplash.com/photo-1464822759023-fed622ff2c3b",
                title: "Snowy Peaks",
                description: "Majestic snow-covered mountain peaks under a clear blue sky.",
                category: "nature"
            },
            {
                src: "https://images.unsplash.com/photo-1477959858617-67f85cf4f1df",
                title: "Urban Architecture",
                description: "Modern architectural marvel with unique geometric patterns.",
                category: "urban"
            },
            {
                src: "https://images.unsplash.com/photo-1543857778-c4a1a569eafe",
                title: "Metropolitan",
                description: "Busy city street with classic architecture and vibrant urban life.",
                category: "urban"
            },
            {
                src: "https://images.unsplash.com/photo-1536520007654-00f0ed4bb3df",
                title: "Colorful Patterns",
                description: "Vibrant mix of colors and shapes creating an eye-catching abstract pattern.",
                category: "abstract"
            }
        ];

        // DOM Elements
        const mainImage = document.getElementById('main-image');
        const imageTitle = document.getElementById('image-title');
        const imageDescription = document.getElementById('image-description');
        const thumbnailsContainer = document.querySelector('.thumbnails');
        const prevBtn = document.getElementById('prev-btn');
        const nextBtn = document.getElementById('next-btn');
        const filterButtons = document.querySelectorAll('.filter-btn');
        const lightbox = document.getElementById('lightbox');
        const lightboxImg = lightbox.querySelector('img');
        const lightboxCaption = lightbox.querySelector('.lightbox-caption');
        const lightboxClose = lightbox.querySelector('.lightbox-close');
        const fullscreenBtn = document.querySelector('.view-fullscreen');

        let currentIndex = 0;
        let filteredImages = [...galleryImages];

        // Initialize gallery
        function initGallery() {
            generateThumbnails();
            showImage(currentIndex);
            
            // Event listeners
            prevBtn.addEventListener('click', showPreviousImage);
            nextBtn.addEventListener('click', showNextImage);
            
            filterButtons.forEach(button => {
                button.addEventListener('click', filterImages);
            });
            
            fullscreenBtn.addEventListener('click', openLightbox);
            lightboxClose.addEventListener('click', closeLightbox);
            
            // Keyboard navigation
            document.addEventListener('keydown', (e) => {
                if (e.key === 'ArrowLeft') showPreviousImage();
                if (e.key === 'ArrowRight') showNextImage();
                if (e.key === 'Escape') closeLightbox();
            });
        }

        // Generate thumbnails
        function generateThumbnails() {
            thumbnailsContainer.innerHTML = '';
            
            filteredImages.forEach((image, index) => {
                const thumbnail = document.createElement('div');
                thumbnail.className = 'thumbnail';
                thumbnail.dataset.index = index;
                
                thumbnail.innerHTML = `
                    <img src="${image.src}" alt="${image.title}">
                    <div class="thumbnail-overlay">${image.title}</div>
                `;
                
                thumbnail.addEventListener('click', () => showImage(index));
                thumbnailsContainer.appendChild(thumbnail);
            });
        }

        // Show image in main display
        function showImage(index) {
            const image = filteredImages[index];
            mainImage.src = image.src;
            mainImage.alt = image.title;
            imageTitle.textContent = image.title;
            imageDescription.textContent = image.description;
            
            // Update active thumbnail
            document.querySelectorAll('.thumbnail').forEach(thumb => {
                thumb.classList.remove('active');
            });
            
            document.querySelector(`.thumbnail[data-index="${index}"]`).classList.add('active');
            
            currentIndex = index;
        }

        // Show previous image
        function showPreviousImage() {
            let newIndex = currentIndex - 1;
            if (newIndex < 0) newIndex = filteredImages.length - 1;
            showImage(newIndex);
        }

        // Show next image
        function showNextImage() {
            let newIndex = currentIndex + 1;
            if (newIndex >= filteredImages.length) newIndex = 0;
            showImage(newIndex);
        }

        // Filter images by category
        function filterImages() {
            const filter = this.dataset.filter;
            
            // Update active filter button
            filterButtons.forEach(btn => btn.classList.remove('active'));
            this.classList.add('active');
            
            // Filter images
            if (filter === 'all') {
                filteredImages = [...galleryImages];
            } else {
                filteredImages = galleryImages.filter(img => img.category === filter);
            }
            
            // Reset to first image and regenerate thumbnails
            currentIndex = 0;
            generateThumbnails();
            showImage(currentIndex);
        }

        // Open lightbox
        function openLightbox() {
            lightbox.style.display = 'flex';
            lightboxImg.src = filteredImages[currentIndex].src;
            lightboxCaption.textContent = filteredImages[currentIndex].title;
        }

        // Close lightbox
        function closeLightbox() {
            lightbox.style.display = 'none';
        }

        // Initialize the gallery when page loads
        window.addEventListener('DOMContentLoaded', initGallery);
    </script>
</body>
</html>
